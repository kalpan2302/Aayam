services:
  db:
    image: postgres:16-alpine
    container_name: aayam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aayam
      POSTGRES_USER: aayam
      POSTGRES_PASSWORD: aayam_dev_123
    ports:
      # Host-side 5434, not 5432: this machine runs another repo's Postgres
      # container on 5432, and that's work infra we never touch from here.
      # The container's own internal port stays 5432 - only the host mapping
      # changed, so `api`'s DATABASE_URL below (which talks to "db:5432" on
      # the Docker network, not the host) needed no change.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aayam -d aayam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aayam_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aayam_api
    restart: unless-stopped
    ports:
      # Host-side 8010, not 8000: this machine runs another, unrelated
      # Docker container on 8000. Internal container port stays 8000 (the
      # uvicorn command below), only the host mapping changed.
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://aayam:aayam_dev_123@db:5432/aayam
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
    driver: local
