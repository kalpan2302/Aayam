# Alembic configuration for Aayam backend

[alembic]
# Path to migration scripts
script_location = migrations

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Version location specification
version_locations = %(here)s/migrations/versions

# Version path separator
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# sqlalchemy.url is overridden dynamically by migrations/env.py
sqlalchemy.url = postgresql+psycopg2://aayam:aayam_dev_123@localhost:5434/aayam

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
